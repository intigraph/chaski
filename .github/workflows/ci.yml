name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.0"
      - run: uv sync --locked
      # A run that collects nothing must not pass: -p no:cacheprovider keeps
      # it hermetic, and the count check fails an empty suite.
      - run: uv run --locked python -m pytest -q -p no:cacheprovider
      - run: test "$(uv run --locked python -m pytest -q --collect-only -p no:cacheprovider | grep -c '::')" -gt 0

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.0"
      - run: uv run --locked ruff check .

  package:
    name: Wheel install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.0"
      - run: uv build
      - name: Prove Darwin inbox custody permits SQLite WAL and excludes aliases
        if: runner.os == 'macOS'
        run: uv run --locked python -m pytest -q test_consumer_lease.py
      - name: Prove the installed wheel outside the checkout
        shell: bash
        run: |
          set -euo pipefail
          wheels=("$GITHUB_WORKSPACE"/dist/*.whl)
          test "${#wheels[@]}" -eq 1
          uv run --no-project --isolated --python 3.11 --directory "$RUNNER_TEMP" --with "${wheels[0]}" \
            python "$GITHUB_WORKSPACE/scripts/smoke-installed.py"

  repository-pendant-source:
    name: Repository pendant source controls
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned RDF test parser
        run: python3 -m pip install rdflib==7.6.0
      - name: Test copied pointer and publication boundaries
        run: |
          python3 scripts/test-repository-share-query.py
          python3 scripts/test-repository-knowledge.py
          python3 scripts/test-repository-share-publication.py
