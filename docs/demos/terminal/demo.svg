<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">Chaski: UNKNOWN is not resolved</title>
<desc id="desc">Real offline Reactor with synthetic query outcomes; no graph connection or notification sink. The animation repeats. The adjacent transcript provides a static alternative.</desc>
<rect width="100%" height="100%" rx="16" fill="#101827"/>
<path d="M0 54H1000" stroke="#334155"/>
<circle cx="28" cy="27" r="7" fill="#fb7185"/>
<circle cx="52" cy="27" r="7" fill="#fbbf24"/>
<circle cx="76" cy="27" r="7" fill="#34d399"/>
<text x="110" y="34" fill="#e2e8f0" font-family="monospace" font-size="20">Chaski: UNKNOWN is not resolved</text>
<g id="frame0" visibility="hidden" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="24">
<animate attributeName="visibility" calcMode="discrete" values="visible;hidden;hidden" keyTimes="0.000000;0.200000;1.000000" dur="20.000s" repeatCount="indefinite"/>
<text x="28" y="94" fill="#6ee7b7" xml:space="preserve">$ python3 run-demo.py status --state canary.json</text>
<text x="28" y="126" fill="#f1f5f9" xml:space="preserve">No offline canary runs.</text>
</g>
<g id="frame1" visibility="hidden" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="24">
<animate attributeName="visibility" calcMode="discrete" values="hidden;visible;hidden;hidden" keyTimes="0.000000;0.200000;0.600000;1.000000" dur="20.000s" repeatCount="indefinite"/>
<text x="28" y="94" fill="#6ee7b7" xml:space="preserve">$ python3 run-demo.py run --state canary.json --focus </text>
<text x="28" y="126" fill="#f1f5f9" xml:space="preserve">urn:demo:canary</text>
<text x="28" y="158" fill="#f1f5f9" xml:space="preserve">Canary: FIRING -&gt; UNKNOWN (preserved) -&gt; RESOLVED.</text>
<text x="28" y="190" fill="#f1f5f9" xml:space="preserve">rule offline-canary UNKNOWN (keeping 1 firing): offline UNKNOWN </text>
<text x="28" y="222" fill="#f1f5f9" xml:space="preserve">control</text>
</g>
<g id="frame2" visibility="visible" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="24">
<animate attributeName="visibility" calcMode="discrete" values="hidden;visible;visible" keyTimes="0.000000;0.600000;1.000000" dur="20.000s" repeatCount="indefinite"/>
<text x="28" y="94" fill="#6ee7b7" xml:space="preserve">$ python3 run-demo.py status --state canary.json</text>
<text x="28" y="126" fill="#f1f5f9" xml:space="preserve">{&quot;fired&quot;: true, &quot;focus&quot;: &quot;urn:demo:canary&quot;, &quot;resolved&quot;: true, </text>
<text x="28" y="158" fill="#f1f5f9" xml:space="preserve">&quot;transitions&quot;: 2, &quot;unknown_preserved&quot;: true, &quot;version&quot;: 1}</text>
</g>
</svg>
