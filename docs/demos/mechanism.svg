<svg xmlns="http://www.w3.org/2000/svg" width="704" height="200" viewBox="0 0 704 200" role="img" aria-labelledby="title desc">
<title id="title">Unknown preserves the last known verdict</title><desc id="desc">Timeout is UNKNOWN; only a conclusive result changes the verdict. Highlighting moves through the conceptual stages; this is not live telemetry.</desc>
<rect width="704" height="200" rx="12" fill="#f3ead8"/>
<g font-family="system-ui, sans-serif" fill="#342e2b"><text x="352" y="36" font-size="21" text-anchor="middle" font-weight="700">Unknown preserves the last known verdict</text><path d="M 224 105 h 20 m -7 -6 l 7 6 -7 6" fill="none" stroke="#8b5e3c" stroke-width="2"/><path d="M 454 105 h 20 m -7 -6 l 7 6 -7 6" fill="none" stroke="#8b5e3c" stroke-width="2"/><g><rect x="24" y="66" width="196" height="78" rx="10" fill="#fff8e8" stroke="#8b5e3c" stroke-width="2"/><rect x="24" y="66" width="196" height="78" rx="10" fill="#dba94e" opacity="0"><animate attributeName="opacity" values="0;0.22;0" dur="6s" begin="0s" repeatCount="indefinite"/></rect><text x="122" y="98" text-anchor="middle" font-size="22" font-weight="700">Firing</text><text x="122" y="125" text-anchor="middle" font-size="16">Known result</text></g><g><rect x="254" y="66" width="196" height="78" rx="10" fill="#fff8e8" stroke="#8b5e3c" stroke-width="2"/><rect x="254" y="66" width="196" height="78" rx="10" fill="#dba94e" opacity="0"><animate attributeName="opacity" values="0;0.22;0" dur="6s" begin="2s" repeatCount="indefinite"/></rect><text x="352" y="98" text-anchor="middle" font-size="22" font-weight="700">Unknown</text><text x="352" y="125" text-anchor="middle" font-size="16">Keep firing</text></g><g><rect x="484" y="66" width="196" height="78" rx="10" fill="#fff8e8" stroke="#8b5e3c" stroke-width="2"/><rect x="484" y="66" width="196" height="78" rx="10" fill="#dba94e" opacity="0"><animate attributeName="opacity" values="0;0.22;0" dur="6s" begin="4s" repeatCount="indefinite"/></rect><text x="582" y="98" text-anchor="middle" font-size="22" font-weight="700">Resolved</text><text x="582" y="125" text-anchor="middle" font-size="16">Known empty result</text></g><text x="352" y="179" font-size="16" text-anchor="middle">Timeout is UNKNOWN; only a conclusive result changes the verdict.</text></g></svg>
