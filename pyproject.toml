[project]
name = "chaski-reactor"
version = "0.10.0"
description = "Reactions and notifications when your knowledge graph changes"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pyyaml==6.0.3",
]

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project.urls]
Homepage = "https://github.com/intigraph/chaski"
Repository = "https://github.com/intigraph/chaski"
Issues = "https://github.com/intigraph/chaski/issues"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[project.scripts]
chaski = "chaski:main"
chaski-event = "external_event:main"
chaski-github-notify = "github_notify:main"
chaski-github-routes = "github_routes:main"
chaski-github-work = "github_work:main"
chaski-main-red = "main_red:main"
chaski-once = "once:main"
chaski-outbox-disposition = "emitter:disposition_main"
chaski-pr-lifecycle = "pr_lifecycle:main"
chaski-recovery-migration = "recovery_migration:main"
chaski-scheduled-expiry = "scheduled_expiry:main"
chaski-state-key-migrate = "state_key_migration:main"

[tool.setuptools]
py-modules = [
    "chaski_version", "chaski_prime", "chaski_prime_state", "chaski_primer",
    "alertmanager_sink", "async_scheduled_sink", "change_frames", "change_stream", "chaski", "command_sink",
    "consumer_lease", "deadline_heap", "demo", "emitter", "external_event", "failure_family_adapter",
    "fixed_outcome_executor", "github_notify", "github_routes", "github_work", "graph_sink", "incremental", "main_red", "once", "pr_lifecycle", "reconcile", "recovery_migration", "scheduled_catalogue_adapter", "scheduled_expiry", "scheduled_event_sink", "scheduled_projection", "scheduled_receiver", "scheduled_sink_factory", "shuttle_process_port", "single_occurrence_projection", "slot_receiver", "state_key_migration", "wall_clock_schedule", "weekly_projection",
]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["."]

[dependency-groups]
build = [
    "setuptools==84.0.0",
]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.0",
]
